<!DOCTYPE html>
<html>
<body style="background:#f0f0f0; display:flex; flex-direction:column; align-items:center; justify-content:center; height:100vh; font-family:sans-serif; margin:0;">
    <h1>Super Clicker</h1>
    <h2 id="score" style="font-size:50px; margin: 10px 0;">0</h2>
    <button onclick="clickBtn()" style="padding:20px 40px; font-size:20px; background:#007bff; color:white; border:none; border-radius:10px; cursor:pointer;">CLICK ME</button>
    <script>
        let score = 0;
        function clickBtn(){ score++; document.getElementById('score').innerText = score; }
    </script>
</body>
</html>
