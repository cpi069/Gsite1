<!DOCTYPE html>
<html>
<body style="margin:0; overflow:hidden; background:#222; display:flex; justify-content:center; align-items:center; height:100vh;">
    <canvas id="gameCanvas" width="400" height="400" style="background:black; border:2px solid white;"></canvas>
    <script>
        const canvas = document.getElementById('gameCanvas');
        const ctx = canvas.getContext('2d');
        let player = {x: 200, y: 350, w: 20, h: 20, color: '#0f0'};
        let enemies = [];
        let score = 0;
        let gameOver = false;

        function update() {
            if(gameOver) return;
            if(Math.random() < 0.05) enemies.push({x: Math.random()*380, y: 0, w: 20, h: 20, s: 2 + Math.random()*3});
            
            enemies.forEach((e, i) => {
                e.y += e.s;
                if(e.y > 400) { enemies.splice(i, 1); score++; }
                if (player.x < e.x + e.w && player.x + player.w > e.x && player.y < e.y + e.h && player.y + player.h > e.y) {
                    gameOver = true; alert('Game Over! Score: ' + score);
                }
            });
        }
        function draw() {
            ctx.clearRect(0,0,400,400);
            ctx.fillStyle = player.color; ctx.fillRect(player.x, player.y, player.w, player.h);
            ctx.fillStyle = 'red'; enemies.forEach(e => ctx.fillRect(e.x, e.y, e.w, e.h));
            ctx.fillStyle = 'white'; ctx.fillText('Score: ' + score, 10, 20);
            if(!gameOver) requestAnimationFrame(() => { update(); draw(); });
        }
        canvas.addEventListener('mousemove', (e) => {
            const rect = canvas.getBoundingClientRect();
            player.x = e.clientX - rect.left - 10;
        });
        draw();
    </script>
</body>
</html>
