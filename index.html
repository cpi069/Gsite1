<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Learning Site!</title>
    <style>
        :root {
            --bg-dark: #121212;
            --bg-panel: #1e1e1e;
            --accent: #00e5ff;
            --text-main: #e0e0e0;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            background-color: var(--bg-dark);
            color: var(--text-main);
        }

        /* Header */
        header {
            background-color: var(--bg-panel);
            padding: 20px;
            text-align: center;
            border-bottom: 2px solid var(--accent);
        }

        header h1 {
            margin: 0;
            color: var(--accent);
        }

        /* Main Content */
        #main {
            padding: 30px;
            max-width: 1000px;
            margin: 0 auto;
        }

        /* Grid */
        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
            gap: 20px;
        }

        .item-card {
            background-color: var(--bg-panel);
            border-radius: 12px;
            padding: 20px;
            text-align: center;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s;
            border: 2px solid transparent;
        }

        .item-card:hover {
            transform: translateY(-5px);
            border-color: var(--accent);
            box-shadow: 0 10px 20px rgba(0, 229, 255, 0.2);
        }

        .icon {
            font-size: 50px;
            margin-bottom: 15px;
        }

        .item-name {
            font-weight: bold;
            font-size: 18px;
        }

        /* Game Overlay */
        #gameOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0,0,0,0.95);
            display: none;
            flex-direction: column;
            z-index: 100;
        }

        #gameHeader {
            height: 60px;
            background-color: #111;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 20px;
            border-bottom: 1px solid var(--accent);
        }

        #gameFrame {
            flex-grow: 1;
            border: none;
            width: 100%;
            background: black;
        }

        .close-btn {
            background: #ff4444;
            color: white;
            border: none;
            padding: 8px 20px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
        }
        
        .close-btn:hover { background: #cc0000; }
    </style>
</head>
<body>

    <header>
        <h1>🎮 My Arcade Site</h1>
    </header>

    <div id="main">
        <div class="grid" id="libraryGrid">
            <!-- Loading message while fetching data -->
            <p id="loadingMsg">Loading games...</p>
        </div>
    </div>

    <!-- Game Overlay -->
    <div id="gameOverlay">
        <div id="gameHeader">
            <span id="overlayTitle" style="font-weight:bold; font-size: 20px;">Game Title</span>
            <button class="close-btn" onclick="closeGame()">Close Game</button>
        </div>
        <iframe id="gameFrame"></iframe>
    </div>

    <script>
        // Fetch the game data from the JSON file
        fetch('games.json')
            .then(response => response.json())
            .then(games => {
                document.getElementById('loadingMsg').style.display = 'none';
                renderGrid(games);
            })
            .catch(error => {
                document.getElementById('loadingMsg').innerText = "Error loading games. (Make sure you are running this on a local server, not just double-clicking the HTML file).";
                console.error('Error fetching games:', error);
            });

        function renderGrid(games) {
            const grid = document.getElementById('libraryGrid');
            
            games.forEach(game => {
                const card = document.createElement('div');
                card.className = 'item-card';
                
                card.innerHTML = `
                    <div class="icon">${game.icon}</div>
                    <div class="item-name">${game.title}</div>
                `;
                
                // When clicked, launch the game using its path
                card.onclick = () => launchGame(game.title, game.path);
                
                grid.appendChild(card);
            });
        }

        function launchGame(title, path) {
            const overlay = document.getElementById('gameOverlay');
            const frame = document.getElementById('gameFrame');
            const titleElement = document.getElementById('overlayTitle');

            titleElement.innerText = title;
            frame.src = path; // Load the actual HTML file from the folder
            overlay.style.display = 'flex';
        }

        function closeGame() {
            const overlay = document.getElementById('gameOverlay');
            const frame = document.getElementById('gameFrame');
            
            overlay.style.display = 'none';
            frame.src = ''; // Unload the game
        }
    </script>
</body>
</html>
